<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Luxury Life Planner | Weekly Scheduler</title>

    <!-- PWA: 홈 화면(바탕화면)에 추가했을 때 앱처럼 동작하도록 하는 설정 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#20487C" />

    <!-- Android: 홈 화면 추가 시 주소창 없이 전체 화면 -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS(아이폰) Safari: 홈 화면 추가 시 주소창 없이 전체 화면 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="라이프 플래너" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
